<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio</title>
  <link rel="stylesheet" href="style.css">
  <script src="libs/three.min.js"></script>
  <script src="libs/GLTFLoader.js"></script>
  <script src="libs/DRACOLoader.js"></script>
  <script src="libs/lil-gui.js"></script>
</head>
<body>
  <!-- Design Panel -->
  <div class="design-panel" id="designPanel">
    <div class="design-header">
      <h3>Customize</h3>
      <button class="design-close" id="designClose">✕</button>
    </div>
    
    <div class="design-tabs">
      <button class="design-tab active" data-tab="colors">🎨 Colors</button>
      <button class="design-tab" data-tab="model">🎛️ Model</button>
      <button class="design-tab" data-tab="notes">📝 Notes</button>
    </div>

    <!-- Colors Tab -->
    <div class="design-tab-content active" id="tab-colors">
      <div class="design-controls" id="designControls"></div>
      <button id="exportColors" class="export-btn">📋 Export Colors</button>
      <div class="design-actions">
        <button id="resetColors" class="export-btn secondary-btn">↺ Reset Theme</button>
        <button id="applyModelPreset" class="export-btn secondary-btn">⚡ Apply Model Preset</button>
      </div>
    </div>

    <!-- Model 3D Controls Tab -->
    <div class="design-tab-content" id="tab-model">
      <div id="guiContainer" class="gui-container"></div>
    </div>

    <!-- Notes Board Tab -->
    <div class="design-tab-content" id="tab-notes">
      <div class="notes-input-section">
        <textarea id="noteInput" placeholder="Add a note or comment..." class="note-textarea"></textarea>
        <button id="addNoteBtn" class="add-note-btn">Add Note</button>
      </div>
      <div id="notesList" class="notes-list"></div>
    </div>
  </div>

  <div class="hero-section">
    <div class="hero-backdrop"></div>
    <div class="hero-vignette"></div>
    <div class="hero-grain"></div>
    <div class="hero-mist layer-1"></div>
    <div class="hero-mist layer-2"></div>
    <div class="hero-mist layer-3"></div>
    <div class="model-container" id="modelContainer">
      <!-- Mobile fallback: static image and explicit load 3D button -->
      <div class="mobile-fallback" id="mobileFallback">
        <div class="fallback-copy" id="fallbackCopy">Tap to load the 3D model</div>
        <button id="load3DButton" class="download-btn">View 3D</button>
      </div>
    </div>
    <button id="downloadButton" class="download-btn">Download CV</button>
    <div class="scroll-hint" id="scrollHint">
      <span class="scroll-dot"></span>
    </div>
  </div>



  <audio id="sound" src="sound.mp3"></audio>
  <script src="script.js"></script>
</body>
</html>
