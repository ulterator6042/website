<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio</title>
  <link rel="preload" as="image" href="skybox2.jpg">
  <link rel="preload" as="fetch" href="3d/abstract.glb" crossorigin>
  <link rel="stylesheet" href="style.css?v=20260208b">
  <script src="libs/three.min.js"></script>
  <script src="libs/GLTFLoader.js"></script>
  <script src="libs/DRACOLoader.js"></script>
  <script src="libs/lil-gui.js"></script>
    <script src="particles.js"></script>
  <script src="particles.js"></script>
</head>
<body>
          <script src="global-gui-toggle.js"></script>
        <!-- Global GUI Toggle Button -->
        <button id="globalGuiToggle" style="position:fixed;top:16px;right:16px;z-index:1000;padding:8px 18px;font-size:18px;border-radius:8px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,0.12);border:1px solid #ccc;cursor:pointer;">Toggle Menus</button>
      <script src="text-video-settings.js"></script>
    <!-- Animated Text Video -->
    <div id="textVideoContainer" style="position:fixed;top:20vh;left:50vw;transform:translate(-50%,-50%);z-index:6;pointer-events:none;">
      <video id="textAnimationVideo" src="textanimation.webm" autoplay loop muted playsinline style="width:480px;height:120px;background:transparent;pointer-events:none;"></video>
    </div>

    <!-- Text Animation Settings GUI -->
    <div class="text-video-settings-panel" id="textVideoSettingsPanel" style="position:fixed;top:20px;left:20px;z-index:10;background:rgba(255,255,255,0.95);box-shadow:0 2px 8px rgba(0,0,0,0.15);padding:16px;border-radius:12px;min-width:220px;">
      <h4 style="margin-top:0">Text Animation Settings</h4>
      <label>Width <input type="number" id="textVideoWidth" min="100" max="1200" value="480" style="width:60px;margin-left:8px"></label><br>
      <label>Height <input type="number" id="textVideoHeight" min="50" max="400" value="120" style="width:60px;margin-left:8px"></label><br>
      <label>Position X <input type="range" id="textVideoPosX" min="0" max="100" value="50" style="width:100px"></label><br>
      <label>Position Y <input type="range" id="textVideoPosY" min="0" max="100" value="20" style="width:100px"></label><br>
      <button id="textVideoSettingsExport" style="margin-top:10px">Export</button>
      <button id="textVideoSettingsClose" style="margin-top:10px">Close</button>
    </div>
  <!-- Design Panel -->
  <div class="design-panel" id="designPanel">
    <div class="design-header">
      <h3>Customize</h3>
      <button class="design-close" id="designClose">✕</button>
    </div>
    
    <div class="design-tabs">
      <button class="design-tab active" data-tab="colors">🎨 Colors</button>
      <button class="design-tab" data-tab="model">🎛️ Model</button>
      <button class="design-tab" data-tab="notes">📝 Notes</button>
    </div>

    <!-- Colors Tab -->
    <div class="design-tab-content active" id="tab-colors">
      <div class="design-controls" id="designControls"></div>
      <button id="exportColors" class="export-btn">📋 Export Colors</button>
      <div class="design-actions">
        <button id="resetColors" class="export-btn secondary-btn">↺ Reset Theme</button>
        <button id="applyModelPreset" class="export-btn secondary-btn">⚡ Apply Model Preset</button>
      </div>
    </div>

    <!-- Model 3D Controls Tab -->
    <div class="design-tab-content" id="tab-model">
      <div id="guiContainer" class="gui-container"></div>
    </div>

    <!-- Notes Board Tab -->
    <div class="design-tab-content" id="tab-notes">
      <div class="notes-input-section">
        <textarea id="noteInput" placeholder="Add a note or comment..." class="note-textarea"></textarea>
        <button id="addNoteBtn" class="add-note-btn">Add Note</button>
      </div>
      <div id="notesList" class="notes-list"></div>
    </div>
  </div>

  <div class="hero-section">
    <div class="hero-backdrop"></div>
    <svg class="hero-blobs" viewBox="0 0 1280 800" preserveAspectRatio="xMidYMid slice">
      <defs>
        <filter id="blob-filter">
          <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="3" result="noise" seed="1" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="80" xChannelSelector="R" yChannelSelector="G" />
        </filter>
        <linearGradient id="blob-gradient-1" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:rgba(199, 208, 220, 0.2); stop-opacity:1" />
          <stop offset="100%" style="stop-color:rgba(110, 120, 135, 0.1); stop-opacity:1" />
        </linearGradient>
        <linearGradient id="blob-gradient-2" x1="100%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" style="stop-color:rgba(158, 170, 190, 0.15); stop-opacity:1" />
          <stop offset="100%" style="stop-color:rgba(80, 95, 115, 0.08); stop-opacity:1" />
        </linearGradient>
        <linearGradient id="blob-gradient-3" x1="0%" y1="100%" x2="100%" y2="0%">
          <stop offset="0%" style="stop-color:rgba(110, 120, 135, 0.1); stop-opacity:1" />
          <stop offset="100%" style="stop-color:rgba(199, 208, 220, 0.15); stop-opacity:1" />
        </linearGradient>
      </defs>
      <g class="blob-group">
        <ellipse class="blob" id="blob-1" cx="200" cy="150" rx="250" ry="200" fill="url(#blob-gradient-1)" filter="url(#blob-filter)" />
        <ellipse class="blob" id="blob-2" cx="1000" cy="250" rx="280" ry="180" fill="url(#blob-gradient-2)" filter="url(#blob-filter)" />
        <ellipse class="blob" id="blob-3" cx="600" cy="600" rx="220" ry="240" fill="url(#blob-gradient-3)" filter="url(#blob-filter)" />
      </g>
    </svg>
    <div class="hero-vignette"></div>
    <div class="hero-grain"></div>
    <div class="hero-mist layer-1"></div>
    <div class="hero-mist layer-2"></div>
    <div class="hero-mist layer-3"></div>
    <div class="model-container" id="modelContainer">
      <!-- Mobile fallback: static image and explicit load 3D button -->
      <div class="mobile-fallback" id="mobileFallback">
        <div class="fallback-copy" id="fallbackCopy">Tap to load the 3D model</div>
        <button id="load3DButton" class="download-btn">View 3D</button>
      </div>
    </div>
    <button id="downloadButton" class="download-btn">Download CV</button>
  </div>

  <!-- Corner Popup Boxes -->
  <div class="boxes-container" id="boxesContainer">
    <div class="corner-box top-left" id="boxTopLeft">
      <img src="icons/download.png" alt="Download Portfolio" class="corner-box-icon" />
    </div>
    <div class="corner-box top-right is-link has-dropdown" id="boxTopRight" role="button" tabindex="0" aria-haspopup="true" aria-expanded="false">
      <img src="icons/contacts.png" alt="Contacts" class="corner-box-icon" />
      <div class="contact-bubble" id="contactBubble">
        <a class="contact-bubble-email" href="mailto:matteo.isabella@gmail.com">matteo.isabella@gmail.com</a>
      </div>
    </div>
    <a class="corner-box bottom-left is-link" id="boxBottomLeft" href="projects.html">
      <img src="icons/projects.png" alt="Other Projects" class="corner-box-icon" />
    </a>
    <a class="corner-box bottom-right is-link" id="boxBottomRight" href="about.html">
      <img src="icons/about%20me.png" alt="About Me" class="corner-box-icon" />
    </a>
  </div>

  <!-- Orbit Controls for Home3 -->
  <div class="orbit-controls" id="orbitControls">
    <div class="orbit-indicators" id="orbitIndicators" aria-hidden="true"></div>
    <button class="orbit-arrow orbit-prev" id="orbitPrev" aria-label="Rotate orbit counter-clockwise">❮</button>
    <button class="orbit-arrow orbit-next" id="orbitNext" aria-label="Rotate orbit clockwise">❯</button>
  </div>

  <button class="box-settings-toggle" id="boxSettingsToggle" aria-label="Toggle customize menu">Customize Menu</button>
  <button class="font-switcher-toggle" id="fontSwitcherToggle" aria-label="Toggle font switcher">Fonts</button>
  <button class="design-panel-toggle" id="designBtn" aria-label="Toggle design panel">Design</button>
  <button class="palette-panel-toggle" id="palettePresetToggle" aria-label="Toggle palette presets">Palettes</button>
  <button class="orbit-colors-toggle" id="orbitColorsToggle" aria-label="Toggle orbit colors">Orbit Colors</button>
  <button class="model-tuner-toggle" id="modelTunerToggle" aria-label="Toggle model tuner">Model</button>

  <!-- Floating Box Settings GUI -->
  <div class="box-settings-panel" id="boxSettingsPanel">
    <div class="settings-header">
      <h3>Customize Menu</h3>
      <div class="settings-actions">
        <button class="settings-export" id="settingsExport">Export</button>
        <button class="settings-close" id="settingsClose">✕</button>
      </div>
    </div>
    <div class="customize-tabs" role="tablist">
      <button class="customize-tab active" data-pane="orbital" role="tab" aria-selected="true">Orbital</button>
    </div>
    <div class="customize-pane active" data-pane="orbital" role="tabpanel">
      <div id="orbitalGuiContainer" class="box-gui-container"></div>
    </div>
  </div>

  <div class="font-switcher-panel" id="fontSwitcherPanel" aria-hidden="true">
    <div class="settings-header">
      <h3>Font Switcher</h3>
      <div class="settings-actions">
        <button class="settings-close" id="fontSwitcherClose">✕</button>
      </div>
    </div>
    <div class="font-switcher-body">
      <label class="font-switcher-label" for="fontSwitcherSelect">Menu font</label>
      <select id="fontSwitcherSelect" class="font-switcher-select"></select>
      <div class="font-switcher-list" id="fontSwitcherList"></div>
      <div class="font-switcher-preview" id="fontSwitcherPreview">Preview the orbit menu text</div>
    </div>
  </div>

  <div class="palette-panel" id="palettePresetPanel" aria-hidden="true">
    <div class="settings-header">
      <h3>Palette Presets</h3>
      <div class="settings-actions">
        <button class="settings-close" id="palettePresetClose">✕</button>
      </div>
    </div>
    <div class="palette-panel-body">
      <label class="palette-toggle-row" for="uiPaletteSyncToggle">
        <span>Sync UI with Palette</span>
        <input type="checkbox" id="uiPaletteSyncToggle" />
      </label>
      <label class="palette-toggle-row" for="orbitPaletteSyncToggle">
        <span>Sync Orbit Menu</span>
        <input type="checkbox" id="orbitPaletteSyncToggle" />
      </label>
      <div class="palette-presets">
        <div class="palette-header">
          <h4>Saved Palettes</h4>
          <button id="savePalettePreset" class="export-btn secondary-btn" type="button">Save Current Palette</button>
        </div>
        <select id="palettePresetSelect" class="palette-select" aria-label="Palette presets"></select>
        <button id="deletePalettePreset" class="export-btn secondary-btn" type="button">Delete Selected</button>
      </div>
    </div>
  </div>

  <div class="orbit-colors-panel" id="orbitColorsPanel" aria-hidden="true">
    <div class="settings-header">
      <h3>Orbit Colors</h3>
      <div class="settings-actions">
        <button class="settings-export" id="orbitColorsExport">Export</button>
        <button class="settings-close" id="orbitColorsClose">✕</button>
      </div>
    </div>
    <div class="orbit-colors-body">
      <div id="orbitColorsGuiContainer" class="box-gui-container"></div>
      <div class="orbit-palette-presets">
        <div class="palette-header">
          <h4>Saved Orbit Palettes</h4>
          <button id="saveOrbitPalette" class="export-btn secondary-btn" type="button">Save Current</button>
        </div>
        <select id="orbitPaletteSelect" class="palette-select" aria-label="Orbit palette presets"></select>
        <button id="deleteOrbitPalette" class="export-btn secondary-btn" type="button">Delete Selected</button>
      </div>
    </div>
  </div>

  <div class="model-tuner-panel" id="modelTunerPanel" aria-hidden="true">
    <div class="settings-header">
      <h3>Model Tuner</h3>
      <div class="settings-actions">
        <button class="settings-export" id="modelTunerExport">Export</button>
        <button class="settings-close" id="modelTunerClose">✕</button>
      </div>
    </div>
    <div id="modelTunerGui" class="box-gui-container"></div>
  </div>

  <audio id="sound" src="sound.mp3"></audio>

  <!-- Particle Settings GUI -->
  <div class="particle-settings-panel" id="particleSettingsPanel" style="position:fixed;top:20px;right:20px;z-index:10;background:rgba(255,255,255,0.95);box-shadow:0 2px 8px rgba(0,0,0,0.15);padding:16px;border-radius:12px;min-width:220px;">
    <h4 style="margin-top:0">Particle Settings</h4>
    <label>Background Color <input type="color" id="particleBgColor" value="#ffffff" style="margin-left:8px"></label><br>
    <label>Dot Color <input type="color" id="particleDotColor" value="#1a237e" style="margin-left:8px"></label><br>
    <label>Dot Size <input type="number" id="particleDotSize" min="1" max="20" value="3" style="width:60px;margin-left:8px"></label><br>
    <label>Quantity <input type="number" id="particleQuantity" min="10" max="300" value="80" style="width:60px;margin-left:8px"></label><br>
    <label>Scatter <input type="number" id="particleScatter" min="1" max="100" value="20" style="width:60px;margin-left:8px"></label><br>
    <label>Position X <input type="range" id="particlePosX" min="0" max="100" value="50" style="width:100px"></label><br>
    <label>Position Y <input type="range" id="particlePosY" min="0" max="100" value="50" style="width:100px"></label><br>
    <label>Speed <input type="number" id="particleSpeed" min="0.01" max="0.5" step="0.01" value="0.08" style="width:60px;margin-left:8px"></label><br>
    <label>Entropy <input type="number" id="particleEntropy" min="0" max="2" step="0.01" value="1" style="width:60px;margin-left:8px"></label><br>
    <label>Linear Ratio <input type="range" id="particleLinearRatio" min="0" max="100" value="30" style="width:100px;margin-left:8px"> <span id="particleLinearRatioValue">30%</span></label><br>
    <button id="particleSettingsImport" style="margin-top:10px">Import</button>
    <button id="particleSettingsExport" style="margin-top:10px">Export</button>
    <button id="particleSettingsClose" style="margin-top:10px">Close</button>
  </div>

  <script src="script.js?v=20260208b"></script>
</body>
</html>
