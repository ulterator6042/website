<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio</title>
  <link rel="preload" as="image" href="skybox2.jpg">
  <link rel="preload" as="fetch" href="3d/abstract.glb" crossorigin>
  <link rel="stylesheet" href="style.css?v=20250206">
  <script src="libs/three.min.js"></script>
  <script src="libs/GLTFLoader.js"></script>
  <script src="libs/DRACOLoader.js"></script>
  <script src="libs/lil-gui.js"></script>
</head>
<body>
  <!-- Design Panel -->
  <div class="design-panel" id="designPanel">
    <div class="design-header">
      <h3>Customize</h3>
      <button class="design-close" id="designClose">✕</button>
    </div>
    
    <div class="design-tabs">
      <button class="design-tab active" data-tab="colors">🎨 Colors</button>
      <button class="design-tab" data-tab="model">🎛️ Model</button>
      <button class="design-tab" data-tab="notes">📝 Notes</button>
    </div>

    <!-- Colors Tab -->
    <div class="design-tab-content active" id="tab-colors">
      <div class="design-controls" id="designControls"></div>
      <button id="exportColors" class="export-btn">📋 Export Colors</button>
      <div class="design-actions">
        <button id="resetColors" class="export-btn secondary-btn">↺ Reset Theme</button>
        <button id="applyModelPreset" class="export-btn secondary-btn">⚡ Apply Model Preset</button>
      </div>
    </div>

    <!-- Model 3D Controls Tab -->
    <div class="design-tab-content" id="tab-model">
      <div id="guiContainer" class="gui-container"></div>
    </div>

    <!-- Notes Board Tab -->
    <div class="design-tab-content" id="tab-notes">
      <div class="notes-input-section">
        <textarea id="noteInput" placeholder="Add a note or comment..." class="note-textarea"></textarea>
        <button id="addNoteBtn" class="add-note-btn">Add Note</button>
      </div>
      <div id="notesList" class="notes-list"></div>
    </div>
  </div>

  <div class="hero-section">
    <div class="hero-backdrop"></div>
    <svg class="hero-blobs" viewBox="0 0 1280 800" preserveAspectRatio="xMidYMid slice">
      <defs>
        <filter id="blob-filter">
          <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="3" result="noise" seed="1" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="80" xChannelSelector="R" yChannelSelector="G" />
        </filter>
        <linearGradient id="blob-gradient-1" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:rgba(199, 208, 220, 0.2); stop-opacity:1" />
          <stop offset="100%" style="stop-color:rgba(110, 120, 135, 0.1); stop-opacity:1" />
        </linearGradient>
        <linearGradient id="blob-gradient-2" x1="100%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" style="stop-color:rgba(158, 170, 190, 0.15); stop-opacity:1" />
          <stop offset="100%" style="stop-color:rgba(80, 95, 115, 0.08); stop-opacity:1" />
        </linearGradient>
        <linearGradient id="blob-gradient-3" x1="0%" y1="100%" x2="100%" y2="0%">
          <stop offset="0%" style="stop-color:rgba(110, 120, 135, 0.1); stop-opacity:1" />
          <stop offset="100%" style="stop-color:rgba(199, 208, 220, 0.15); stop-opacity:1" />
        </linearGradient>
      </defs>
      <g class="blob-group">
        <ellipse class="blob" id="blob-1" cx="200" cy="150" rx="250" ry="200" fill="url(#blob-gradient-1)" filter="url(#blob-filter)" />
        <ellipse class="blob" id="blob-2" cx="1000" cy="250" rx="280" ry="180" fill="url(#blob-gradient-2)" filter="url(#blob-filter)" />
        <ellipse class="blob" id="blob-3" cx="600" cy="600" rx="220" ry="240" fill="url(#blob-gradient-3)" filter="url(#blob-filter)" />
      </g>
    </svg>
    <div class="hero-vignette"></div>
    <div class="hero-grain"></div>
    <div class="hero-mist layer-1"></div>
    <div class="hero-mist layer-2"></div>
    <div class="hero-mist layer-3"></div>
    <div class="model-container" id="modelContainer">
      <!-- Mobile fallback: static image and explicit load 3D button -->
      <div class="mobile-fallback" id="mobileFallback">
        <div class="fallback-copy" id="fallbackCopy">Tap to load the 3D model</div>
        <button id="load3DButton" class="download-btn">View 3D</button>
      </div>
    </div>
    <button id="downloadButton" class="download-btn">Download CV</button>
  </div>

  <!-- Corner Popup Boxes -->
  <div class="boxes-container" id="boxesContainer">
    <div class="corner-box top-left" id="boxTopLeft">
      <span class="corner-box-label">Download Portfolio</span>
    </div>
    <div class="corner-box top-right is-link has-dropdown" id="boxTopRight" role="button" tabindex="0" aria-haspopup="true" aria-expanded="false">
      <span class="corner-box-label">Contacts</span>
      <div class="contact-dropdown" id="contactDropdown">
        <div class="dropdown-title">Contact</div>
        <a class="dropdown-item" href="mailto:matteo.isabella@gmail.com">matteo.isabella@gmail.com</a>
        <a class="dropdown-item" href="tel:+393917229267">+39 391 722 9267</a>
        <div class="dropdown-item muted">Milan, Italy</div>
      </div>
    </div>
    <a class="corner-box bottom-left is-link" id="boxBottomLeft" href="projects.html">
      <span class="corner-box-label">Other Projects</span>
    </a>
    <a class="corner-box bottom-right is-link" id="boxBottomRight" href="about.html">
      <span class="corner-box-label">About Me</span>
    </a>
  </div>

  <!-- Orbit Controls for Home3 -->
  <div class="orbit-controls" id="orbitControls">
    <div class="orbit-indicators" id="orbitIndicators" aria-hidden="true"></div>
    <button class="orbit-arrow orbit-prev" id="orbitPrev" aria-label="Rotate orbit counter-clockwise">❮</button>
    <button class="orbit-arrow orbit-next" id="orbitNext" aria-label="Rotate orbit clockwise">❯</button>
  </div>

  <button class="box-settings-toggle" id="boxSettingsToggle" aria-label="Toggle customize menu">Customize Menu</button>
  <button class="font-switcher-toggle" id="fontSwitcherToggle" aria-label="Toggle font switcher">Fonts</button>

  <!-- Floating Box Settings GUI -->
  <div class="box-settings-panel" id="boxSettingsPanel">
    <div class="settings-header">
      <h3>Customize Menu</h3>
      <div class="settings-actions">
        <button class="settings-export" id="settingsExport">Export</button>
        <button class="settings-close" id="settingsClose">✕</button>
      </div>
    </div>
    <div class="customize-tabs" role="tablist">
      <button class="customize-tab active" data-pane="orbital" role="tab" aria-selected="true">Orbital</button>
    </div>
    <div class="customize-pane active" data-pane="orbital" role="tabpanel">
      <div id="orbitalGuiContainer" class="box-gui-container"></div>
    </div>
  </div>

  <div class="font-switcher-panel" id="fontSwitcherPanel" aria-hidden="true">
    <div class="settings-header">
      <h3>Font Switcher</h3>
      <div class="settings-actions">
        <button class="settings-close" id="fontSwitcherClose">✕</button>
      </div>
    </div>
    <div class="font-switcher-body">
      <label class="font-switcher-label" for="fontSwitcherSelect">Menu font</label>
      <select id="fontSwitcherSelect" class="font-switcher-select"></select>
      <div class="font-switcher-list" id="fontSwitcherList"></div>
      <div class="font-switcher-preview" id="fontSwitcherPreview">Preview the orbit menu text</div>
    </div>
  </div>

  <audio id="sound" src="sound.mp3"></audio>
  <script src="script.js?v=20250206"></script>
</body>
</html>
